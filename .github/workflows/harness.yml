name: harness

on:
  pull_request:
  push:
    branches: [main]

env:
  HARNESS_REPO: https://github.com/NguyenvantuanT/rual-transpo-skills-claude.git

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git clone --depth 1 "$HARNESS_REPO" .harness

      - name: Rules (chỉ dòng PR thêm/sửa — nợ cũ để harness-gardening)
        if: github.event_name == 'pull_request'
        env:
          HARNESS_DIFF: origin/${{ github.base_ref }}
        run: bash .harness/scripts/check.sh $(git diff --name-only "origin/${{ github.base_ref }}" -- lib supabase pubspec.yaml)
      - name: Docs drift
        run: bash .harness/scripts/docs-check.sh

      - id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - name: Test
        run: if [ -d test ]; then flutter test; fi
